	<meta name="dcterms.title" content="Reserve Bank Board - New Arrangements for Communication | Media Releases" />
	
	<meta name="description" content="After a review by the Reserve Bank Board of its communication practices, the Board has decided to 1: release a short statement each month explaining its decision whether or not the cash rate is to be changed; 2: Commencing February 2008, the monetary policy decision will be announced at 2.30 pm on the day of the meeting instead of 9.30 am the day after the meeting; and 3: the Board will release the minutes of its monetary policy meeting each month two weeks after the meeting" />
